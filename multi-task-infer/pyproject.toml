[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-external-executor"
version = "0.1.0"
description = "External Executor Plugin for vLLM - Pre-start Ray Actors for faster initialization"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "vLLM Contributors"}
]
keywords = ["vllm", "llm", "inference", "ray", "executor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "vllm",
    "ray[default]>=2.9",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
mooncake = [
    "mooncake-transfer-engine",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.entry-points."vllm.general_plugins"]
external_executor = "vllm_external_executor:register_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["vllm_external_executor*"]

[tool.setuptools.package-data]
"*" = ["py.typed"]
